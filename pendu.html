<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Pendu</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="hangman-app">
      <header class="runner-header">
        <div>
          <p class="runner-kicker">ARCADE // MOTS</p>
          <h1>LE <span>PENDU</span></h1>
        </div>
        <div class="score-panel">
          <span>VIES</span>
          <strong id="hangman-lives">7</strong>
        </div>
      </header>

      <section class="game-card hangman-card" aria-label="Jeu du pendu">
        <div class="hangman-layout">
          <div class="hangman-drawing" aria-label="Dessin du pendu">
            <svg viewBox="0 0 220 240" role="img" aria-labelledby="drawing-title">
              <title id="drawing-title">Dessin du pendu</title>
              <line class="hangman-part" data-part="0" x1="25" y1="220" x2="195" y2="220" />
              <line class="hangman-part" data-part="0" x1="60" y1="220" x2="60" y2="25" />
              <line class="hangman-part" data-part="0" x1="60" y1="25" x2="150" y2="25" />
              <line class="hangman-part" data-part="0" x1="150" y1="25" x2="150" y2="55" />
              <circle class="hangman-part" data-part="1" cx="150" cy="78" r="23" />
              <line class="hangman-part" data-part="2" x1="150" y1="101" x2="150" y2="160" />
              <line class="hangman-part" data-part="3" x1="150" y1="115" x2="115" y2="140" />
              <line class="hangman-part" data-part="4" x1="150" y1="115" x2="185" y2="140" />
              <line class="hangman-part" data-part="5" x1="150" y1="160" x2="120" y2="200" />
              <line class="hangman-part" data-part="6" x1="150" y1="160" x2="180" y2="200" />
            </svg>
          </div>

          <div class="hangman-content">
            <p id="hangman-status" class="hangman-status" aria-live="polite">Trouve le mot secret !</p>
            <p id="hangman-word" class="hangman-word" aria-label="Mot à deviner"></p>
            <p class="hangman-help">Choisis une lettre ou utilise ton clavier.</p>
            <div id="hangman-letters" class="hangman-letters" aria-label="Lettres disponibles"></div>
            <button id="hangman-start" class="start-button" type="button">NOUVELLE PARTIE</button>
          </div>
        </div>
      </section>

      <a class="hangman-back" href="./index.html">RETOUR AU MENU</a>
    </main>
    <script src="./pendu.js"></script>
  </body>
</html>
